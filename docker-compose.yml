# ──────────────────────────────────────────────────────────────
# docker-compose.yml — Local development environment
#
# Usage:
#   docker compose up -d          → start all services
#   docker compose down           → stop all services
#   docker compose logs -f api    → tail API logs
#   docker compose exec api sh    → shell into API container
#
# NOTE: This uses a local Postgres instance.
# For production, DATABASE_URL points to Supabase instead.
# ──────────────────────────────────────────────────────────────

services:

  # ── Local PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      # Override DATABASE_URL to point at the local container
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
    driver: local
